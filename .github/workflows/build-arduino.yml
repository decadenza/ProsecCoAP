# Created this action based on information found in:
# - <https://github.com/marketplace/actions/test-compile-for-arduino>
# - <https://docs.github.com/en/free-pro-team@latest/actions/quickstart>
name: Build with Arduino CLI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    name: Arduino build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arduino UNO
            arduino-board-fqbn: arduino:avr:uno
            platform-url: ""
            required-libraries: Ethernet
            sketch-names-find-start: examples
            sketches-exclude: esp32,esp8266
          - name: ESP8266
            arduino-board-fqbn: esp8266:esp8266:nodemcuv2
            platform-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            required-libraries: ""
            sketch-names-find-start: examples/esp8266
            sketches-exclude: ""
          - name: ESP32
            arduino-board-fqbn: esp32:esp32:esp32thing
            platform-url: https://dl.espressif.com/dl/package_esp32_index.json
            required-libraries: ""
            sketch-names-find-start: examples/esp32
            sketches-exclude: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Update test code environments.
        run: |
          python -m pip install --upgrade pip
          pip install pyserial
      - name: Arduino build
        uses: ArminJo/arduino-test-compile@v3
        with:
          arduino-board-fqbn: ${{ matrix.arduino-board-fqbn }}
          platform-url: ${{ matrix.platform-url }}
          required-libraries: ${{ matrix.required-libraries }}
          sketch-names: "*.ino"
          sketch-names-find-start: ${{ matrix.sketch-names-find-start }}
          sketches-exclude: ${{ matrix.sketches-exclude }}
