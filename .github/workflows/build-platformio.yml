name: build-platformio
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This creates a separate runner for each board simultaneously
        board: [esp32thing, uno, nodemcuv2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.board }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Examples
        run: |
          # Install the Ethernet library dependency globally for this runner
          pio lib install "Ethernet"

          # Loop through every .ino file found in the examples subdirectories
          # 'pio ci' builds each file in isolation so they don't conflict
          for example in examples/*/*.ino; do
            echo "-------------------------------------------------------"
            echo "BUILDING: $example for ${{ matrix.board }}"
            echo "-------------------------------------------------------"
            pio ci "$example" --board=${{ matrix.board }} --lib="."
          done
